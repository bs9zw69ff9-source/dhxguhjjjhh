# The C# suite, on every push.
#
# There was a second job here for the Node bot, which was kept as a rollback
# target and tested so that it stayed one. The Node bot has been removed now that
# C# has taken over, so there is one bot and one suite.
name: tests
on:
  push:
  pull_request:

jobs:
  csharp:
    name: C#
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

      # Proves the whole object graph resolves and the configuration binds. It
      # catches a broken DI registration, which a unit test cannot see because
      # nothing else constructs the real graph.
      - name: selftest
        run: |
          printf 'DISCORD_TOKEN=ci-not-a-real-token\nRCON_HOST_1=127.0.0.1\nRCON_PORT_1=9100\nRCON_PASSWORD_1=ci\nMASTER_NAMES=ci\n' > .env
          dotnet run --project src/PavlovBot.Host -c Release --no-build -- --selftest
