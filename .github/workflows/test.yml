# The bot's merge gate, on every push: fmt, clippy with warnings as errors, the whole test
# suite, the release build, and the selftest. It runs rust/tools/gate.sh, the same script a
# contributor runs locally, so the two cannot drift apart.
name: tests
on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: bash rust/tools/gate.sh
        env:
          CARGO_INCREMENTAL: "0"

      # Proves the whole object graph builds and the configuration binds. It catches a broken
      # wiring that no unit test can see, because nothing else constructs the real graph.
      - name: selftest
        working-directory: rust
        run: |
          printf 'DISCORD_TOKEN=ci-not-a-real-token\nRCON_HOST_1=127.0.0.1\nRCON_PORT_1=9100\nRCON_PASSWORD_1=ci\nMASTER_NAMES=ci\n' > .env
          ./target/release/pavlov-bot --selftest
