# /etc/anti-ddos/logrotate.conf - run every 10 minutes by anti-ddos-logrotate.timer, with
# its own state file, NOT from /etc/logrotate.d (the daily job would double-rotate it).
#
# BOTH SIZE AND AGE: a file rotates when it passes `maxsize`, or once a day. Rotated
# files get a timestamp (the bot reads them back by name), are gzipped one cycle later,
# and are deleted past `maxage` days or `rotate` files. The bot's storage guard also caps
# the whole folder at ANTIDDOS_LOG_MAX_MB and deletes the oldest rotated files first.

/var/log/anti-ddos/packets/packets.jsonl {
    daily
    maxsize 50M
    rotate 60
    maxage 30
    dateext
    dateformat -%Y%m%d-%H%M%S
    compress
    delaycompress
    missingok
    notifempty
    create 0600 ulog ulog
    sharedscripts
    postrotate
        # ulogd reopens its file on SIGHUP.
        systemctl kill --kill-who=main --signal=SIGHUP ulogd2.service >/dev/null 2>&1 || true
    endscript
}

# The bot opens its files per write, so a rename needs no signal: the next write creates the new file.
/var/log/anti-ddos/sources.jsonl /var/log/anti-ddos/traffic.jsonl {
    daily
    maxsize 50M
    rotate 60
    maxage 30
    dateext
    dateformat -%Y%m%d-%H%M%S
    compress
    delaycompress
    missingok
    notifempty
    nocreate
}

# Events are the record that matters - bans, decisions, admin actions - and they are small: a year.
/var/log/anti-ddos/events.jsonl {
    weekly
    maxsize 20M
    rotate 104
    maxage 365
    dateext
    dateformat -%Y%m%d-%H%M%S
    compress
    delaycompress
    missingok
    notifempty
    nocreate
}
