# ulogd2 for the Pavlov bot's anti-DDoS firewall. Installed by scripts/antiddos/install.sh
# (the original is kept as /etc/ulogd.conf.pre-antiddos).
#
# ONE STACK: packets the nftables table `inet pavlovbot_ddos` logs to NFLOG group 7 are
# written as JSON Lines to /var/log/anti-ddos/packets/packets.jsonl. Only what the
# firewall chooses to log arrives here - drops, suspicious sources, samples - and every
# log rule is rate-limited in the kernel, so this file cannot outrun its budget.
#
# NFLOG, NOT THE KERNEL LOG: nothing goes through printk, journald or rsyslog, so there is
# no second copy and no logging loop.
[global]
logfile="syslog"
loglevel=3

plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_raw2packet_BASE.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_filter_IFINDEX.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_filter_IP2STR.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_output_JSON.so"

stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,json1:JSON

[log1]
# Must match ANTIDDOS_NFLOG_GROUP in the bot's .env (default 7).
group=7

[json1]
file="/var/log/anti-ddos/packets/packets.jsonl"
# Each record is flushed: the rate is bounded, and a crash loses nothing.
sync=1
timestamp=1
