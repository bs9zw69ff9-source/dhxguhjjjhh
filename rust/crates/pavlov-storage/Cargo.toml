[package]
name = "pavlov-storage"
description = "Where the bot's data lives: SQLite and file backends, atomic writes, the datasets, the game's own files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
pavlov-core = { path = "../pavlov-core" }
pavlov-rcon = { path = "../pavlov-rcon" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "fs"] }
tracing.workspace = true

[dev-dependencies]
pavlov-core = { path = "../pavlov-core", features = ["testing"] }
futures-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

[lints]
workspace = true
