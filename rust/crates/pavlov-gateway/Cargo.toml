[package]
name = "pavlov-gateway"
description = "The serenity adapter: the only crate that knows Discord's wire types. It converts interactions into pavlov-discord's plain values and implements its seams over Discord's REST and gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
pavlov-core = { path = "../pavlov-core" }
pavlov-discord = { path = "../pavlov-discord" }
pavlov-host = { path = "../pavlov-host" }
serde_json.workspace = true
serenity.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
chrono.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
