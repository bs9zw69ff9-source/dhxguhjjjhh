[package]
name = "pavlov-host"
description = "The bot's work on the box and its servers: processes, systemd, ufw, the RCON registry, observability, logs and the services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
futures-util.workspace = true
nix.workspace = true
pavlov-config = { path = "../pavlov-config" }
pavlov-core = { path = "../pavlov-core" }
pavlov-rcon = { path = "../pavlov-rcon" }
pavlov-storage = { path = "../pavlov-storage" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "rt", "macros", "fs"] }
tracing.workspace = true

[dev-dependencies]
pavlov-rcon = { path = "../pavlov-rcon", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }

[lints]
workspace = true
