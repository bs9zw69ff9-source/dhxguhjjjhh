[package]
name = "pavlov-core"
description = "Pure domain rules of the Pavlov bot: no I/O, no Discord, no sockets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
fancy-regex.workspace = true
indexmap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# "sync" only: async locks with no runtime attached, so the crate stays free of I/O.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
