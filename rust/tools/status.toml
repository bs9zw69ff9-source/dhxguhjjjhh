# Port status, read by rust/tools/parity.py and rust/tools/inventory.py.
#
# [files]: a C# test FILE (stem) marked "ported" must have every one of its test methods
# present in Rust, in a file of the same name in snake_case. parity.py fails the gate the
# moment a ported file is missing a test, so "ported" is a claim the tool checks.
#
# [dropped]: C# tests deliberately NOT ported, as "File::Method" glob patterns, each with the
# reason. Anything not ported and not listed here is simply not done yet.

[files]
BanSpanOverflowTests = "ported"
BanTests = "ported"
DomainTests = "ported"
EvasionScorerTests = "ported"
FactionTests = "ported"
IntelligenceRulesTests = "ported"
LedgerConcurrencyTests = "ported"
PenalCodeTests = "ported"
ProfileRedactionTests = "ported"
RiskScoringTests = "ported"

[dropped]
# Nothing is dropped at present. The fallout theme's tests (FalloutPresetTests) were deleted
# from the C# with the theme itself (2026-11-17), and the tests that exercised a mechanism
# through fallout data were moved onto police data there, so they port like any other.
